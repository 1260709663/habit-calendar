<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3b6fe0">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>习惯打卡 · 本地日历</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2330; --muted:#68748a;
  --line:#e4e8ef; --cell:#edf0f5;
  --body:#e4e9f1; --muscle:#cfd8e5;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -14px rgba(16,24,40,.22);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101319; --card:#181d25; --ink:#e8ecf3; --muted:#94a1b5;
    --line:#272e39; --cell:#222934; --body:#2a313b; --muscle:#38414e;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.7); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  padding:28px 16px 56px}
.wrap{max-width:1000px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3{margin:0}
.warn{margin-bottom:14px;padding:10px 14px;border-radius:10px;background:#fff3cd;color:#7a5b00;font-size:13px;border:1px solid #f0d98a}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:23px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.card-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.add{margin-bottom:16px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.add select,.add input{background:transparent;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;color:var(--ink);font:inherit;min-width:0}
.add select{width:66px;text-align:center;font-size:17px}
.add input{flex:1 1 200px}
.add select:focus-visible,.add input:focus-visible{outline:2px solid #4f8cff55;outline-offset:1px;border-color:#4f8cff}
.swatches{display:flex;gap:6px;padding:0 4px}
.swatch{width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--sw);
  opacity:.55;transition:transform .12s,opacity .12s}
.swatch:hover{opacity:.85}
.swatch[aria-pressed="true"]{opacity:1;transform:scale(1.12);
  box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--sw)}
.btn{background:#3b6fe0;color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);
  font-weight:500;padding:8px 14px;border-radius:999px;font-size:13px}
.btn.ghost:hover{background:var(--cell)}
.monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 14px}
.monthbar h2{font-size:17px;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:18px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:var(--shadow)}
.nav:hover{border-color:#4f8cff}
#todayBtn{font-size:13px;padding:6px 12px;margin-left:4px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.habit{padding:14px 16px 16px;border-top:4px solid var(--c)}
.head{display:flex;align-items:center;gap:10px}
.badge{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-size:18px;background:color-mix(in srgb,var(--c) 16%,transparent)}
.title{flex:1;min-width:0}
.title h3{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin:2px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{border:1px solid var(--c);color:var(--c);background:transparent;border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.check.on{background:var(--c);color:#fff}
.del{border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 2px;opacity:.5}
.del:hover{opacity:1;color:#e5484d}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 6px;
  font-size:11px;color:var(--muted);text-align:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;border:0;border-radius:9px;background:var(--cell);font-size:13px;
  font-variant-numeric:tabular-nums;padding:0;transition:background .1s,box-shadow .1s}
.day:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--c)}
.day.done{background:var(--c);color:#fff;font-weight:650}
.day.today{box-shadow:inset 0 0 0 2px var(--c)}
.day.today.done{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.day.today:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--c),inset 0 0 0 4px rgba(255,255,255,.5)}
.day:disabled{opacity:.3}
.blank{aspect-ratio:1}
.empty{text-align:center;color:var(--muted);padding:40px 12px 28px}
.empty h2{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty p{margin:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{border:1px dashed var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px}
.chip:hover{border-color:#4f8cff;color:#3b6fe0}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-top:28px;font-size:12px;color:var(--muted)}
.foot label{cursor:pointer}
@media (max-width:560px){ .board{grid-template-columns:1fr} }

/* ===== 训练 ===== */
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px;width:max-content;box-shadow:var(--shadow)}
.backuptip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:9px 12px;
  border-radius:12px;background:#fff7e0;border:1px solid #f0d98a;color:#7a5b00;font-size:12.5px}
.backuptip[hidden]{display:none}
.backuptip span{flex:1 1 200px}
@media (prefers-color-scheme: dark){
  .backuptip{background:#3a3218;border-color:#5c4c1a;color:#f0d98a}
}
.tab{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.tab.on{background:#3b6fe0;color:#fff}
.train-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.train-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.cal{padding:14px 14px 12px}
.calbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.calbar h2{font-size:15px;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.tday{position:relative;height:40px;border:0;border-radius:9px;background:var(--cell);font-size:13px;
  font-variant-numeric:tabular-nums;padding:0;transition:background .1s,box-shadow .1s}
.tday.push{background:color-mix(in srgb,#4f8cff 16%,var(--cell))}
.tday.pull{background:color-mix(in srgb,#22b573 16%,var(--cell))}
.tday.legs{background:color-mix(in srgb,#f08c2e 18%,var(--cell))}
.tday:not(:disabled):hover{box-shadow:inset 0 0 0 2px #4f8cff}
.tday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.tday.sel{outline:2px solid #3b6fe0;outline-offset:1px}
.tday .dot{position:absolute;left:50%;bottom:5px;transform:translateX(-50%)}
.tday:disabled{opacity:.3}
.cal .blank{aspect-ratio:auto;height:40px}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.dot.push{background:#4f8cff}.dot.pull{background:#22b573}.dot.legs{background:#f08c2e}
.week{padding:14px 16px;margin-top:14px}
.week h3{font-size:14px;margin-bottom:10px}
.wrow{display:grid;grid-template-columns:26px 1fr 104px;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.wbar{height:8px;border-radius:99px;background:var(--cell);overflow:hidden}
.wbar i{display:block;height:100%;background:#3b6fe0;border-radius:99px}
.wrow b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:11px}
.weektotal{margin:0 0 8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.weekhint{color:var(--muted);font-size:12px;margin:8px 0 0}
.dayp{padding:16px;min-width:0}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayhead h2{font-size:17px}
.types{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;
  font-size:13px;font-weight:600;color:var(--muted)}
.tbtn.on{color:#fff;border-color:transparent}
.tbtn.on[data-type="push"]{background:#4f8cff}
.tbtn.on[data-type="pull"]{background:#22b573}
.tbtn.on[data-type="legs"]{background:#f08c2e}
.ab{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:2px}
.ab button{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.ab button.on{background:var(--ink);color:var(--card)}
.items{margin-top:14px}
.emptyday{color:var(--muted);font-size:13px;padding:16px 2px;margin:0}
.item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.itemhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
  padding:10px 12px;text-align:left}
.itemhead:hover{background:var(--cell)}
.ipart{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;flex:none}
.iname{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isets{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);flex:none}
.icar{color:var(--muted);font-size:12px;flex:none}
.iedit{font-size:11px;color:#3b6fe0;background:color-mix(in srgb,#3b6fe0 10%,transparent);
  border-radius:999px;padding:2px 9px;flex:none}
.item.open .iedit{color:var(--muted);background:transparent;border:1px solid var(--line)}
.detail{padding:0 12px 12px;border-top:1px dashed var(--line)}
.last{margin:8px 0;font-size:12px;color:var(--muted)}
.setrow{display:flex;align-items:center;gap:6px;margin:6px 0}
.setrow input{width:72px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--ink);padding:6px 8px;font:inherit;font-size:13px}
@media (max-width:420px){
  .setrow input{width:62px}
}
.setrow input:focus-visible,.note:focus-visible{outline:2px solid #4f8cff55;border-color:#4f8cff}
.setrow span{font-size:12px;color:var(--muted)}
.setrow button{border:0;background:transparent;color:var(--muted);font-size:14px;padding:2px 4px}
.detailrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.mini{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;
  font-size:12px;color:var(--muted)}
.mini:hover{border-color:#3b6fe0;color:#3b6fe0}
.mini.danger{color:#e5484d;border-color:#e5484d55}
.mini.danger:hover{background:#e5484d;color:#fff;border-color:#e5484d}
.note{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--ink);padding:6px 8px;font:inherit;font-size:12px}
.partchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;
  font-size:12px;font-weight:600;color:var(--muted)}
.pchip.on{background:#3b6fe0;border-color:transparent;color:#fff}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:0;border-top:0}
.addrow input,.addrow select{border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--ink);padding:7px 9px;font:inherit;font-size:13px;min-width:0}
.addrow input:focus-visible,.addrow select:focus-visible{outline:2px solid #4f8cff55;border-color:#4f8cff}
#exName{flex:1 1 150px}
#exW,#exR{width:66px}
#exS{width:60px}
.exquick{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.qchip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:5px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.qchip:hover{border-color:#3b6fe0;color:#3b6fe0}
.addhint{margin:6px 0 0;font-size:12px;color:var(--muted)}
.bodymap polygon[data-part]{cursor:pointer}
.bodymap polygon[data-part]:hover{filter:brightness(1.07)}
.rrow[data-part]{cursor:pointer;border-radius:6px}
.rrow[data-part]:hover{background:var(--cell)}
.dayfoot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.daysum{margin-top:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px 14px;max-width:430px;width:100%;max-height:80vh;overflow:auto;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
.sheet h3{font-size:16px;margin-bottom:2px}
.mpr{color:var(--muted);font-size:12px;margin:0 0 8px}
.mclose{position:absolute;right:10px;top:8px;border:0;background:transparent;color:var(--muted);font-size:15px}
.spark{display:block;width:100%;height:auto;margin:8px 0 10px;overflow:visible}
.hist{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;
  border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.hist:last-child{border:0}
.hist b{font-weight:600}
.muted{color:var(--muted);font-size:12px}
.bhint{margin:0 0 2px;font-size:12px;color:var(--muted)}
.bodymap{display:block;width:100%;height:auto;max-width:420px;margin:6px auto 2px}
.bodymap polygon{stroke:none}
.figcap{fill:var(--muted);font-size:11px;text-anchor:middle}
.blegend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:2px 0 8px}
.blegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.rrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}
.rrow b{color:var(--ink);font-weight:600}
.bodybox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.bodybox h4{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.bodybox .bodymap{max-width:360px}
.impbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.impbtns .btn{width:100%}
.restbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;background:#1b2330;color:#fff;border-radius:999px;
  padding:8px 12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);z-index:60;font-size:12px}
.restbar[hidden]{display:none}
.restbar.done{background:#1f7a4d}
.restbar b{font-size:16px;font-variant-numeric:tabular-nums;min-width:46px;text-align:center}
.rbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:4px 8px;font-size:11px}
.rbtn:hover{background:rgba(255,255,255,.26)}
.rbtn.primary{background:#3b6fe0}
.rbtn.primary:hover{background:#4f8cff}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(8px);background:#ffe9a8;color:#6d5400;border:1px solid #e0b13a;
  border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:61;white-space:nowrap;max-width:90vw;overflow:hidden;
  text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.item.pr{border-color:#e0b13a;box-shadow:0 0 0 1px #e0b13a55}
.item.pr .isets{color:#b8860b;font-weight:700}
.prbadge{font-size:10px;color:#7a5b00;background:#ffe9a8;border-radius:999px;padding:1px 6px;
  flex:none;font-weight:700}
.tplrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.tplhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.tplhead b{font-size:14px}
.tplhead span{color:var(--muted);font-size:12px}
.tplnames{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.tplbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
@media (prefers-color-scheme: dark){
  .item.pr .isets{color:#e8c35a}
  .prbadge{background:#4a3c10;color:#ffdf8a}
}
@media (max-width:820px){.train-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="backuptip" id="backupTip" hidden>
    <span>数据只存在这台设备的浏览器里，建议复制一份备份。</span>
    <button type="button" class="mini" id="backupNow">导出备份</button>
    <button type="button" class="mini" id="backupLater">稍后</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="视图">
    <button class="tab on" type="button" role="tab" data-tab="habits" aria-selected="true">打卡</button>
    <button class="tab" type="button" role="tab" data-tab="train" aria-selected="false">训练</button>
  </nav>
  <div id="tab-habits">
  <div id="warn" class="warn" hidden>浏览器禁止了本地存储，打卡记录无法保存。请换用 Chrome 或 Edge 打开。</div>

  <div class="top">
    <div>
      <h1>习惯打卡 <span aria-hidden="true">🌱</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="pill" id="todayStat"></div>
  </div>

  <form class="card-panel add" id="addForm">
    <select id="emoji" aria-label="图标">
      <option>🌱</option><option>📚</option><option>🏃</option><option>💧</option><option>🧘</option>
      <option>💪</option><option>🎯</option><option>✍️</option><option>🛌</option><option>🍎</option>
    </select>
    <input id="name" maxlength="24" placeholder="新习惯，例如：睡前阅读 20 分钟" autocomplete="off" required>
    <div class="swatches" id="swatches" role="group" aria-label="颜色"></div>
    <button class="btn" type="submit">添加</button>
  </form>

  <div class="monthbar">
    <button class="nav" id="prev" aria-label="上一月" type="button">‹</button>
    <h2 id="monthLabel"></h2>
    <button class="nav" id="next" aria-label="下一月" type="button">›</button>
    <button class="btn ghost" id="todayBtn" type="button">回到本月</button>
  </div>

  <div class="board" id="board"></div>
  <div class="empty" id="empty" hidden>
    <h2>还没有习惯</h2>
    <p>先加一个想坚持的小事，之后点日历格子就能打卡。</p>
    <div class="chips" id="chips"></div>
  </div>

  <div class="foot">
    <button class="btn ghost" id="exportBtn" type="button">导出备份</button>
    <label class="btn ghost">导入（覆盖）<input id="importFile" type="file" accept=".json,application/json" hidden></label>
    <span>数据只保存在本机浏览器，建议偶尔导出备份</span>

<script>
(function () {
  'use strict';

  const KEY = 'habit-calendar-v1';
  const PALETTE = ['#4f8cff', '#22b573', '#f08c2e', '#9b6bff', '#e5484d', '#12a8b8', '#c9a227', '#e05a8f'];
  const SUGGEST = [['💧', '喝水'], ['📚', '阅读'], ['🏃', '运动'], ['🛌', '早睡'], ['✍️', '写日记']];
  const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const DAY = 86400000;

  const $ = (s, root) => (root || document).querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const toKey = (dt) => keyOf(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  const dayNum = (key) => {
    const p = key.split('-').map(Number);
    return Date.UTC(p[0], p[1] - 1, p[2]) / DAY;
  };
  const fromDayNum = (n) => {
    const dt = new Date(n * DAY);
    return keyOf(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  };
  const uid = () => (window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  const today = new Date();
  const todayKey = toKey(today);

  // 今天还没打卡时，连续天数从昨天往前算，避免早上打开就显示中断
  function currentStreak(days, tKey) {
    let n = dayNum(tKey);
    if (!days[tKey]) n -= 1;
    let count = 0;
    while (days[fromDayNum(n)]) { count += 1; n -= 1; }
    return count;
  }

  function longestStreak(days) {
    const nums = Object.keys(days).map(dayNum).sort((a, b) => a - b);
    let best = 0, run = 0, prev = null;
    for (const n of nums) {
      run = (prev !== null && n === prev + 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = n;
    }
    return best;
  }

  function normalizeHabit(h, i) {
    const days = {};
    const src = (h && typeof h.days === 'object' && h.days) || {};
    for (const k of Object.keys(src)) {
      if (src[k] && /^\d{4}-\d{2}-\d{2}$/.test(k)) days[k] = 1;
    }
    return {
      id: typeof h.id === 'string' && h.id ? h.id : uid(),
      name: String(h.name).slice(0, 24),
      emoji: typeof h.emoji === 'string' && h.emoji ? h.emoji.slice(0, 4) : '🌱',
      color: /^#[0-9a-f]{6}$/i.test(h.color || '') ? h.color : PALETTE[i % PALETTE.length],
      days: days,
      updatedAt: Number(h.updatedAt) || 0,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { habits: [] };
      const data = JSON.parse(raw);
      const list = Array.isArray(data) ? data : (data && data.habits);
      if (!Array.isArray(list)) return { habits: [] };
      return { habits: list.filter((h) => h && typeof h.name === 'string').map(normalizeHabit) };
    } catch (err) {
      return { habits: [] };
    }
  }

  let state = load();
  const view = { y: today.getFullYear(), m: today.getMonth() + 1 };
  let pickedColor = PALETTE[0];

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      $('#warn').hidden = false;
    }
  }

  function renderHead() {
    const total = state.habits.length;
    const done = state.habits.filter((h) => h.days[todayKey]).length;
    $('#sub').textContent = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' +
      today.getDate() + '日 ' + WD[today.getDay()] + ' · 记录每一个小坚持';
    $('#todayStat').textContent = '今天 ' + done + ' / ' + total;
  }

  function habitCard(h) {
    const y = view.y, m = view.m;
    const prefix = y + '-' + pad(m) + '-';
    const monthDone = Object.keys(h.days).filter((k) => k.startsWith(prefix)).length;
    const cur = currentStreak(h.days, todayKey);
    const best = longestStreak(h.days);
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    const dim = new Date(y, m, 0).getDate();
    const todayNum = dayNum(todayKey);
    const doneToday = Boolean(h.days[todayKey]);

    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="blank"></span>';
    for (let d = 1; d <= dim; d++) {
      const key = prefix + pad(d);
      const done = Boolean(h.days[key]);
      const isToday = key === todayKey;
      const future = dayNum(key) > todayNum;
      cells += '<button type="button" class="day' + (done ? ' done' : '') +
        (isToday ? ' today' : '') + '" data-date="' + key +
        '" aria-pressed="' + done + '" aria-label="' + key + ' ' + (done ? '已打卡' : '未打卡') +
        '"' + (future ? ' disabled' : '') + '>' + d + '</button>';
    }

    return '<article class="card-panel habit" data-id="' + esc(h.id) + '" style="--c:' + h.color + '">' +
      '<div class="head">' +
        '<span class="badge" aria-hidden="true">' + esc(h.emoji) + '</span>' +
        '<div class="title"><h3>' + esc(h.name) + '</h3>' +
          '<p class="meta">本月 ' + monthDone + ' 天 · 连续 ' + cur + ' 天 · 最长 ' + best + ' 天</p></div>' +
        '<button type="button" class="check' + (doneToday ? ' on' : '') +
          '" data-act="check" title="切换今天的打卡状态">' + (doneToday ? '✓ 已打' : '打卡') + '</button>' +
        '<button type="button" class="del" data-act="del" aria-label="删除这个习惯">✕</button>' +
      '</div>' +
      '<div class="dow" aria-hidden="true">' +
        ['一', '二', '三', '四', '五', '六', '日'].map((w) => '<span>' + w + '</span>').join('') +
      '</div>' +
      '<div class="days">' + cells + '</div>' +
    '</article>';
  }

  function renderBoard() {
    $('#monthLabel').textContent = view.y + '年' + view.m + '月';
    const board = $('#board');
    const has = state.habits.length > 0;
    $('#empty').hidden = has;
    board.innerHTML = has ? state.habits.map(habitCard).join('') : '';
  }

  function render() {
    renderHead();
    renderBoard();
  }

  function addHabit(name, emoji, color) {
    name = String(name || '').trim().slice(0, 24);
    if (!name) return;
    state.habits.push({
      id: uid(),
      name: name,
      emoji: emoji || '🌱',
      color: color || PALETTE[state.habits.length % PALETTE.length],
      days: {},
      updatedAt: Date.now(),
    });
    save();
    render();
  }

  function toggleDay(id, date) {
    const h = state.habits.find((x) => x.id === id);
    if (!h || dayNum(date) > dayNum(todayKey)) return;
    if (h.days[date]) delete h.days[date];
    else h.days[date] = 1;
    h.updatedAt = Date.now();
    save();
    render();
  }

  function removeHabit(id) {
    const h = state.habits.find((x) => x.id === id);
    if (!h) return;
    if (!confirm('删除「' + h.name + '」？它的打卡记录也会一起删除。')) return;
    state.habits = state.habits.filter((x) => x.id !== id);
    save();
    render();
  }

  function renderSwatches() {
    $('#swatches').innerHTML = PALETTE.map((c) =>
      '<button type="button" class="swatch" style="--sw:' + c + '" data-color="' + c +
      '" aria-pressed="' + (c === pickedColor) + '" aria-label="颜色 ' + c + '"></button>'
    ).join('');
  }

  $('#addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('#name');
    if (!input.value.trim()) return;
    addHabit(input.value, $('#emoji').value, pickedColor);
    input.value = '';
    input.focus();
  });

  $('#swatches').addEventListener('click', (e) => {
    const b = e.target.closest('.swatch');
    if (!b) return;
    pickedColor = b.dataset.color;
    renderSwatches();
  });

  $('#board').addEventListener('click', (e) => {
    const card = e.target.closest('.habit');
    if (!card) return;
    const id = card.dataset.id;
    const day = e.target.closest('.day');
    if (day) { toggleDay(id, day.dataset.date); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    if (act.dataset.act === 'check') toggleDay(id, todayKey);
    if (act.dataset.act === 'del') removeHabit(id);
  });

  $('#chips').innerHTML = SUGGEST.map((s) =>
    '<button type="button" class="chip" data-name="' + s[1] + '">' + s[0] + ' ' + s[1] + '</button>'
  ).join('');
  $('#chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip');
    if (!c) return;
    addHabit(c.dataset.name, c.textContent.trim().split(' ')[0], PALETTE[state.habits.length % PALETTE.length]);
  });

  $('#prev').addEventListener('click', () => {
    view.m -= 1;
    if (view.m < 1) { view.m = 12; view.y -= 1; }
    renderBoard();
  });
  $('#next').addEventListener('click', () => {
    view.m += 1;
    if (view.m > 12) { view.m = 1; view.y += 1; }
    renderBoard();
  });
  $('#todayBtn').addEventListener('click', () => {
    view.y = today.getFullYear();
    view.m = today.getMonth() + 1;
    renderBoard();
  });

  $('#exportBtn').addEventListener('click', () => {
    const payload = { app: 'habit-calendar', version: 1, exportedAt: new Date().toISOString(), habits: state.habits };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '习惯打卡备份-' + todayKey + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : (data && data.habits);
      if (!Array.isArray(list)) throw new Error('文件里没有找到习惯列表');
      const habits = list.filter((h) => h && typeof h.name === 'string').map(normalizeHabit);
      if (!confirm('导入 ' + habits.length + ' 个习惯，会覆盖当前的 ' + state.habits.length + ' 个，继续吗？')) return;
      state = { habits: habits };
      save();
      render();
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  });

  renderSwatches();
  render();
})();
</script>

    const rows = realSessions().filter((r) => r[0] < selKey);
    for (let i = rows.length - 1; i >= 0; i--) {
      const it = rows[i][1].items.filter((x) => x.name === name)[0];
      if (it) {
        const best = it.sets.reduce((a, b) => (e1(b) > e1(a) ? b : a), it.sets[0]);
        return { date: rows[i][0], best: best, n: it.sets.length };
      }
    }
    return null;
  }

  function bestE1Before(name, before) {
    let best = null;
    for (const k of Object.keys(state.sessions)) {
      if (k >= before) continue;
      for (const it of state.sessions[k].items) {
        if (it.name !== name) continue;
        for (const st of it.sets) {
          const v = e1(st);
          if (!best || v > best.v) best = { v: v, set: st };
        }
      }
    }
    return best;
  }

  function itemPR(it) {
    if (!it.sets.length) return null;
    const best = bestE1Before(it.name, selKey);
    if (!best) return null;
    const top = it.sets.reduce((a, b) => (e1(b) > e1(a) ? b : a), it.sets[0]);
    return e1(top) > best.v + 1e-9 ? { set: top, v: e1(top), old: best.v } : null;
  }

  function itemRow(it, i) {
    const open = expanded === i;
    const last = prevItem(it.name);
    const pr = itemPR(it);
    let lastTxt = '第一次做这个动作';
    if (last) {
      lastTxt = '上次 ' + last.date.slice(5).replace('-', '/') + '：' + fmtW(last.best[0]) + '×' +
        last.best[1] + '×' + last.n;
      lastTxt += last.best[0] > 0 ? '，可试 ' + (last.best[0] + 2.5) + 'kg' : '，试试多 1 次';
    }
    const ivol = it.sets.reduce((a, x) => a + x[0] * x[1], 0);
    if (ivol) lastTxt += '；本次容量 ' + fmtVol(ivol);
    const setsHtml = it.sets.map((x, si) =>
      '<div class="setrow">' +
        '<input type="number" step="0.5" min="0" inputmode="decimal" value="' + x[0] + '" data-i="' + i + '" data-s="' + si +
          '" data-f="w" aria-label="重量 kg">' +
        '<span>kg ×</span>' +
        '<input type="number" step="1" min="1" inputmode="numeric" value="' + x[1] + '" data-i="' + i + '" data-s="' + si +
          '" data-f="r" aria-label="次数">' +
        '<span>次</span>' +
        '<input type="number" step="1" min="0" max="10" inputmode="numeric" class="rir" value="' +
          (x[2] === null || x[2] === undefined ? '' : x[2]) +
          '" data-i="' + i + '" data-s="' + si + '" data-f="rir" placeholder="RIR" aria-label="RIR 余力次数" title="RIR：还能做几次">' +
      '</div>'
    ).join('');

    return '<div class="item' + (open ? ' open' : '') + (pr ? ' pr' : '') + '">' +
      '<button type="button" class="itemhead" data-act="toggle" data-i="' + i + '" aria-expanded="' + open + '">' +
        '<span class="ipart">' + esc(it.part) + '</span>' +
        '<span class="iname">' + esc(it.name) + '</span>' +
        (pr ? '<span class="prbadge">🏆 PR</span>' : '') +
        '<span class="isets">' + summaryOf(it.sets) + '</span>' +
        '<span class="iedit">' + (open ? '收起' : '编辑') + '</span>' +
      '</button>' +
      (open ? '<div class="detail">' +
        '<p class="last">' + esc(lastTxt) + '</p>' +
        '<div class="sets">' + setsHtml + '</div>' +
        '<div class="detailrow">' +
          '<button type="button" class="mini" data-act="addSet" data-i="' + i + '">+ 加一组</button>' +
          '<button type="button" class="mini" data-act="delLastSet" data-i="' + i + '">− 减一组</button>' +
          '<button type="button" class="mini" data-act="chart" data-i="' + i + '">趋势</button>' +
          '<input class="note" data-i="' + i + '" data-f="note" value="' + esc(it.note) + '" placeholder="备注（可选）">' +
          '<button type="button" class="mini danger" data-act="delItem" data-i="' + i + '">删除动作</button>' +
        '</div>' +
      '</div>' : '') +
    '</div>';
  }

  function datalist(part) {
    const names = {};
    SEED.forEach((s) => { if (!part || s[1] === part) names[s[0]] = 1; });
    Object.keys(state.exercises).forEach((n) => {
      if (!part || state.exercises[n] === part) names[n] = 1;
    });
    return Object.keys(names).map((n) => '<option value="' + esc(n) + '">').join('');
  }

  function quickList(part) {
    const names = {};
    SEED.forEach((s) => { if (s[1] === part) names[s[0]] = 1; });
    Object.keys(state.exercises).forEach((n) => {
      if (state.exercises[n] === part) names[n] = 1;
    });
    return Object.keys(names).map((n) =>
      '<button type="button" class="qchip" data-name="' + esc(n) + '">' + esc(n) + '</button>').join('');
  }

  function renderDay() {
    const parts = selKey.split('-').map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    const title = parts[1] + '月' + parts[2] + '日 ' + WD[dt.getDay()];

    if (dayNum(selKey) > dayNum(todayKey)) {
      $('#tDay').innerHTML = '<div class="dayhead"><div><h2>' + title + '</h2>' +
        '<p class="sub">还没到这一天</p></div></div>';
      return;
    }

    const s = cur();
    const isDraft = !state.sessions[selKey];
    const last = lastSameAb(s.type, s.ab, selKey) || lastSameType(s.type, selKey);
    const gap = last ? dayNum(selKey) - dayNum(last[0]) : null;
    const metaText = gap !== null
      ? '上次' + TYPES[last[1].type].label + last[1].ab + '：' + gap + ' 天前'
      : (isDraft ? '选好推 / 拉 / 蹲，在下面加第一个动作' : '这个类型还没有历史记录');

    const chips = ORDER.map((t) =>
      '<button type="button" class="tbtn' + (t === s.type ? ' on' : '') + '" data-type="' + t + '">' +
        TYPES[t].label + '</button>'
    ).join('');

    const itemsHtml = s.items.map((it, i) => itemRow(it, i)).join('');

    let vol = 0, setsN = 0;
    s.items.forEach((it) => it.sets.forEach((x) => { setsN += 1; vol += x[0] * x[1]; }));
    const pc = {};
    s.items.forEach((it) => { pc[it.part] = (pc[it.part] || 0) + it.sets.length; });
    const partList = PARTS.filter((p) => pc[p]).map((p) =>
      '<div class="rrow"><span>' + p + '</span><b>' + pc[p] + ' 组</b></div>').join('');

    const footBtns = [];
    footBtns.push('<button type="button" class="mini" id="tplOpen">模板</button>');
    if (last) {
      footBtns.push('<button type="button" class="mini" id="copyLast">复制上次 ' +
        TYPES[last[1].type].label + last[1].ab + '</button>');
    }
    if (!isDraft) footBtns.push('<button type="button" class="mini danger" id="clearDay">清空这天</button>');

    $('#tDay').innerHTML =
      '<div class="dayhead">' +
        '<div><h2>' + title + '</h2><p class="sub">' + metaText + '</p></div>' +
        '<div class="types">' + chips +
          '<span class="ab">' + ['A', 'B'].map((a) =>
            '<button type="button" data-ab="' + a + '" class="' + (a === s.ab ? 'on' : '') + '">' + a + '</button>'
          ).join('') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="items">' +
        (itemsHtml || '<p class="emptyday">还没有动作。先在下面选部位，再挑一个动作，或者复制上次同类型。</p>') +
      '</div>' +
      '<div class="partchips">' + PARTS.map((p) =>
        '<button type="button" class="pchip' + (p === addPart ? ' on' : '') + '" data-p="' + p + '">' +
        p + '</button>').join('') + '</div>' +
      '<div class="addrow">' +
        '<input id="exName" list="exList" placeholder="搜「' + addPart + '」动作，或直接输入" autocomplete="off">' +
        '<datalist id="exList">' + datalist(addPart) + '</datalist>' +
        '<input id="exW" type="number" step="0.5" min="0" inputmode="decimal" placeholder="kg">' +
        '<input id="exR" type="number" step="1" min="1" inputmode="numeric" placeholder="次">' +
        '<input id="exS" type="number" step="1" min="1" inputmode="numeric" value="3" placeholder="组">' +
        '<button type="button" class="btn" id="exAdd">添加</button>' +
      '</div>' +
      '<div class="exquick" id="exQuick">' + quickList(addPart) + '</div>' +
      '<p class="addhint" id="addHint">点动作直接填入，也可以手动输入。</p>' +
      '<div class="daysum">' +
        (s.items.length ? s.items.length + ' 个动作 · ' + setsN + ' 组 · 容量 ' + fmtVol(vol) : '今天还没记录') +
      '</div>' +
      (s.items.length ? '<div class="bodybox"><h4>这次练到</h4>' + bodySvg(sessionFill(s)) +
        '<div class="rgrid">' + partList + '</div></div>' : '') +
      (footBtns.length ? '<div class="dayfoot">' + footBtns.join('') + '</div>' : '');
  }

  /* ---- 渲染：本周部位 ---- */
  function renderWeek() {
    const range = weekRange();
    const sets = {};
    const vols = {};
    let totalSets = 0, totalVol = 0, days = 0;
    for (const k of Object.keys(state.sessions)) {
      if (k < range[0] || k > range[1]) continue;
      const s = state.sessions[k];
      if (!s.items.length) continue;
      days += 1;
      s.items.forEach((it) => {
        let v = 0;
        it.sets.forEach((x) => { v += x[0] * x[1]; });
        sets[it.part] = (sets[it.part] || 0) + it.sets.length;
        vols[it.part] = (vols[it.part] || 0) + v;
        totalSets += it.sets.length;
        totalVol += v;
      });
    }
    const maxVol = Math.max(1, ...PARTS.map((p) => vols[p] || 0));
    const maxSets = Math.max(1, ...PARTS.map((p) => sets[p] || 0));
    const useVol = totalVol > 0;
    const rows = PARTS.map((p) => {
      const n = sets[p] || 0;
      const v = vols[p] || 0;
      const w = Math.round(((useVol ? v / maxVol : n / maxSets)) * 100);
      return '<div class="wrow"><span>' + p + '</span>' +
        '<div class="wbar"><i style="width:' + w + '%"></i></div>' +
        '<b>' + n + ' 组 · ' + fmtVol(v) + '</b></div>';
    }).join('');
    const head = totalSets
      ? '<p class="weektotal">本周 ' + days + ' 练 · ' + totalSets + ' 组 · 容量 ' + fmtVol(totalVol) + '</p>'
      : '<p class="weekhint">本周还没有训练记录</p>';
    $('#tWeek').innerHTML = head + rows;
  }

  /* ---- 人体图 ---- */
  function lastTrainedPart(part) {
    let best = null;
    for (const k of Object.keys(state.sessions)) {
      if (k > todayKey) continue;
      if (state.sessions[k].items.some((it) => it.part === part) && (!best || k > best)) best = k;
    }
    return best;
  }

  function recoveryOf(part) {
    let load = 0;
    for (const k of Object.keys(state.sessions)) {
      if (k > todayKey) continue;
      const age = dayNum(todayKey) - dayNum(k);
      if (age > 10) continue;
      let sets = 0, vol = 0;
      state.sessions[k].items.forEach((it) => {
        if (it.part !== part) return;
        sets += it.sets.length;
        it.sets.forEach((x) => { vol += x[0] * x[1]; });
      });
      if (!sets) continue;
      load += (sets + vol / 4000) * Math.pow(0.5, age / 2.5);
    }
    return Math.max(0, Math.min(100, Math.round(100 - (load / 18) * 100)));
  }

  function recoveryColor(pct) {
    if (pct >= 80) return '#22b573';
    if (pct >= 60) return '#7fb84a';
    if (pct >= 40) return '#e0b13a';
    if (pct >= 20) return '#f08c2e';
    return '#e5484d';
  }

  function sessionFill(s) {
    const counts = {};
    s.items.forEach((it) => { counts[it.part] = (counts[it.part] || 0) + it.sets.length; });
    return (part) => {
      const n = counts[part] || 0;
      if (!n) return { fill: 'var(--muscle)', op: 1 };
      return { fill: PART_COLORS[part] || '#e5484d', op: Math.min(0.95, 0.35 + n * 0.09) };
    };
  }

  function muscles(list, fillOf) {
    let out = '';
    list.forEach((r) => {
      const part = MUSCLE_PART[r[0]];
      const f = part ? fillOf(part) : { fill: 'var(--body)', op: 1 };
      const style = ' style="fill:' + f.fill + ';fill-opacity:' + f.op + '"';
      const attrs = part ? ' data-part="' + part + '" title="' + part + '"' : '';
      r[1].forEach((pts) => { out += '<polygon points="' + pts + '"' + style + attrs + '/>'; });
    });
    return out;
  }

  function bodySvg(fillOf) {
    return '<svg class="bodymap" viewBox="0 0 209 234" role="img" aria-label="肌肉分布">' +
      '<g>' + muscles(ANTERIOR_MU, fillOf) + '</g>' +
      '<g transform="translate(109 0)">' + muscles(POSTERIOR_MU, fillOf) + '</g>' +
      '<text class="figcap" x="50" y="230">正面</text>' +
      '<text class="figcap" x="160" y="230">背面</text>' +
      '</svg>';
  }

  function renderRecovery() {
    const info = {};
    PARTS.forEach((p) => {
      const d = lastTrainedPart(p);
      info[p] = {
        days: d ? dayNum(todayKey) - dayNum(d) : null,
        pct: d ? recoveryOf(p) : null,
      };
    });
    const fillOf = (part) => {
      const r = info[part];
      if (!r || r.pct === null) return { fill: 'var(--muscle)', op: 1 };
      return { fill: recoveryColor(r.pct), op: 0.92 };
    };
    const rows = realSessions().filter((r) => r[0] <= todayKey);
    const lastRow = rows.length ? rows[rows.length - 1] : null;
    let lastTxt = '还没有训练记录';
    if (lastRow) {
      const dd = dayNum(todayKey) - dayNum(lastRow[0]);
      lastTxt = '上次训练 ' + lastRow[0].slice(5).replace('-', '/') + ' · ' +
        (dd === 0 ? '今天' : dd + ' 天前');
    }
    lastTxt += ' · 点部位筛选';
    const list = PARTS.map((p) => {
      const r = info[p];
      const t = r.days === null ? '未记录' : r.days === 0 ? '今天' : r.days === 1 ? '昨天' : r.days + ' 天前';
      const txt = r.pct === null ? t : r.pct + '% · ' + t;
      const color = r.pct === null ? '' : ' style="color:' + recoveryColor(r.pct) + '"';
      return '<div class="rrow" data-part="' + p + '"><span>' + p + '</span><b' + color + '>' + txt + '</b></div>';
    }).join('');
    $('#tBody').innerHTML =
      '<p class="bhint">' + lastTxt + '</p>' +
      bodySvg(fillOf) +
      '<div class="blegend">' +
        '<span><i style="background:#22b573"></i>已恢复</span>' +
        '<span><i style="background:#7fb84a"></i>基本恢复</span>' +
        '<span><i style="background:#e0b13a"></i>一般</span>' +
        '<span><i style="background:#f08c2e"></i>偏疲劳</span>' +
        '<span><i style="background:#e5484d"></i>需要休息</span>' +
      '</div>' +
      '<div class="rgrid">' + list + '</div>';
  }

  /* ---- 动作趋势 ---- */
  function spark(rows) {
    if (rows.length < 2) return '<p class="muted">至少两次记录才会出现曲线</p>';
    const W = 280, H = 90, P = 12;
    const vs = rows.map((r) => r.v);
    const min = Math.min(...vs), max = Math.max(...vs);
    const span = max - min || 1;
    const pts = rows.map((r, i) => {
      const x = P + i * (W - 2 * P) / (rows.length - 1);
      const y = H - P - (r.v - min) / span * (H - 2 * P);
      return [x, y];
    });
    const poly = pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const dots = pts.map((p) =>
      '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#3b6fe0"/>').join('');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="1RM 趋势">' +
      '<polyline points="' + poly + '" fill="none" stroke="#3b6fe0" stroke-width="2" stroke-linejoin="round"/>' +
      dots + '</svg>';
  }

  function openChart(i) {
    const it = cur().items[i];
    if (!it) return;
    const hist = [];
    for (const k of Object.keys(state.sessions)) {
      const s = state.sessions[k];
      const x = s.items.filter((y) => y.name === it.name)[0];
      if (!x || !x.sets.length) continue;
      const best = x.sets.reduce((a, b) => (e1(b) > e1(a) ? b : a), x.sets[0]);
      hist.push({ k: k, best: best, v: e1(best) });
    }
    hist.sort((a, b) => (a.k < b.k ? -1 : 1));
    const pr = hist.reduce((m, r) => (r.v > m.v ? r : m), hist[0]);
    $('#mTitle').textContent = it.name;
    $('#mPr').textContent = hist.length + ' 次记录 · 估算 1RM 最高 ' + pr.v.toFixed(1) + ' kg（' + pr.k + '）';
    $('#mChart').innerHTML = spark(hist.slice(-10));
    $('#mList').innerHTML = hist.slice(-8).reverse().map((r) =>
      '<div class="hist"><span>' + r.k.slice(5) + '</span><b>' + fmtW(r.best[0]) + '×' + r.best[1] +
      '</b><span>e1RM ' + r.v.toFixed(1) + '</span></div>').join('');
    $('#tModal').hidden = false;
  }

  /* ---- 操作 ---- */
  function copyLast() {
    const s = cur();
    const last = lastSameAb(s.type, s.ab, selKey) || lastSameType(s.type, selKey);
    if (!last) return;
    const target = ensure();
    if (target.items.length && !confirm('这会替换这天的动作，继续？')) return;
    target.type = last[1].type;
    target.ab = last[1].ab;
    target.items = last[1].items.map((it) => ({
      name: it.name,
      part: it.part,
      note: '',
      sets: it.sets.map((x) => [x[0], x[1], x[2] === undefined ? null : x[2]]),
    }));
    expanded = -1;
    persist();
    renderAll();
  }

  function addExercise() {
    const nameEl = $('#exName');
    if (!nameEl) return;
    const name = nameEl.value.trim().slice(0, 20);
    if (!name) { nameEl.focus(); return; }
    const w = Math.max(0, Number($('#exW').value) || 0);
    const r = Math.max(1, Math.floor(Number($('#exR').value) || 8));
    const n = Math.max(1, Math.floor(Number($('#exS').value) || 3));
    const part = SEED_MAP.get(name) || state.exercises[name] || addPart;
    const s = ensure();
    const sets = [];
    for (let i = 0; i < n; i++) sets.push([w, r, null]);
    s.items.push({ name: name, part: part, note: '', sets: sets });
    state.exercises[name] = part;
    addPart = part;
    expanded = s.items.length - 1;
    persist();
    renderAll();
    const added = s.items[s.items.length - 1];
    const pr = itemPR(added);
    if (pr) {
      showToast('🎉 ' + name + ' 新纪录 ' + fmtW(pr.set[0]) + '×' + pr.set[1] +
        '（e1RM ' + pr.v.toFixed(1) + '）');
    }
    startRest(REST_SEC, sets.length);
    const again = $('#exName');
    if (again) { again.value = ''; again.focus(); }
  }

  function updateAddHints() {
    const nameEl = $('#exName');
    const wEl = $('#exW');
    const rEl = $('#exR');
    const hint = $('#addHint');
    if (!nameEl) return;
    const name = nameEl.value.trim();
    const last = name ? prevItem(name) : null;
    if (wEl) wEl.placeholder = last ? fmtW(last.best[0]) + '×' + last.best[1] : 'kg';
    if (rEl) rEl.placeholder = last ? String(last.best[1]) : '次';
    if (hint) {
      if (last) {
        hint.textContent = '上次「' + name + '」' + fmtW(last.best[0]) + '×' + last.best[1] + '×' + last.n +
          (last.best[0] > 0 ? '，可试 ' + (last.best[0] + 2.5) + 'kg' : '，试试多 1 次');
      } else if (name) {
        hint.textContent = '「' + name + '」没有历史记录，先定个基准。';
      } else {
        hint.textContent = '点动作直接填入，也可以手动输入。';
      }
    }
  }

  function selectPart(part) {
    if (PARTS.indexOf(part) === -1) return;
    addPart = part;
    refreshAdd();
    const panel = $('#tDay');
    if (panel && window.innerWidth < 840 && panel.scrollIntoView) {
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function refreshAdd() {
    const chips = document.querySelectorAll('#tDay .pchip');
    for (let i = 0; i < chips.length; i++) {
      if (chips[i].dataset.p === addPart) chips[i].classList.add('on');
      else chips[i].classList.remove('on');
    }
    const list = $('#exList');
    if (list) list.innerHTML = datalist(addPart);
    const quick = $('#exQuick');
    if (quick) quick.innerHTML = quickList(addPart);
    const name = $('#exName');
    if (name) name.placeholder = '搜「' + addPart + '」动作，或直接输入';
    updateAddHints();
  }

  /* ---- 组间休息 ---- */
  let restEnd = 0;
  let restIv = null;
  let restSet = 0;
  let restTotal = 0;

  function updateRestUI() {
    const label = $('#restLabel');
    if (label) label.textContent = restTotal > 1 ? '休息 ' + restSet + '/' + restTotal : '组间休息';
    const next = $('#restNext');
    if (next) next.hidden = !(restTotal > 0 && restSet < restTotal);
  }

  function startRest(sec, sets) {
    const bar = $('#restBar');
    if (!bar) return;
    if (typeof sets === 'number' && sets > 0) {
      restTotal = sets;
      restSet = 1;
    }
    restEnd = Date.now() + (sec === undefined ? REST_SEC : sec) * 1000;
    bar.hidden = false;
    bar.classList.remove('done');
    updateRestUI();
    tickRest();
    clearInterval(restIv);
    restIv = setInterval(tickRest, 250);
  }

  function tickRest() {
    const bar = $('#restBar');
    if (!bar) return;
    const left = Math.max(0, Math.round((restEnd - Date.now()) / 1000));
    const t = $('#restTime');
    if (t) t.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) {
      clearInterval(restIv);
      restIv = null;
      bar.classList.add('done');
      const more = restTotal > 0 && restSet < restTotal;
      const label = $('#restLabel');
      if (label) label.textContent = more ? '第 ' + restSet + ' 组完成' : '休息结束';
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(200); } catch (err) { /* 忽略 */ }
      }
      if (!more) {
        const endAt = restEnd;
        setTimeout(() => { if (restEnd === endAt) bar.hidden = true; }, 4000);
      }
    }
  }

  function nextRest() {
    if (!(restTotal > 0 && restSet < restTotal)) return;
    restSet += 1;
    startRest(REST_SEC);
  }

  function stopRest() {
    clearInterval(restIv);
    restIv = null;
    const bar = $('#restBar');
    if (bar) bar.hidden = true;
    restTotal = 0;
    restSet = 0;
  }

  /* ---- 提示 ---- */
  let toastTimer = null;
  function showToast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2600);
  }

  /* ---- 训练模板 ---- */
  function renderTpl() {
    $('#tplList').innerHTML = ORDER.map((t) => {
      const tpl = state.templates[t];
      const items = tpl ? tpl.items : [];
      const names = items.map((it) => esc(it.name)).join(' · ');
      return '<div class="tplrow">' +
        '<div class="tplhead"><b>' + TYPES[t].label + '日</b><span>' + items.length + ' 个动作</span></div>' +
        (items.length ? '<p class="tplnames">' + names + '</p>' : '<p class="tplnames">还没有模板</p>') +
        '<div class="tplbtns">' +
          '<button type="button" class="mini" data-tpl-apply="' + t + '"' + (items.length ? '' : ' disabled') + '>套用</button>' +
          '<button type="button" class="mini" data-tpl-save="' + t + '">用今天存为模板</button>' +
          (items.length ? '<button type="button" class="mini danger" data-tpl-del="' + t + '">清除</button>' : '') +
        '</div></div>';
    }).join('');
  }

  function openTpl() {
    renderTpl();
    $('#tplModal').hidden = false;
  }

  function closeTpl() {
    $('#tplModal').hidden = true;
  }

  function applyTemplate(t) {
    const tpl = state.templates[t];
    if (!tpl) return;
    const s = ensure();
    if (s.items.length && !confirm('这会替换这天的动作，继续？')) return;
    s.type = t;
    s.items = tpl.items.map((it) => ({
      name: it.name,
      part: it.part,
      note: '',
      sets: it.sets.map((x) => [x[0], x[1], x[2] === undefined ? null : x[2]]),
    }));
    persist();
    renderAll();
    closeTpl();
    showToast('已套用 ' + TYPES[t].label + '日模板');
    startRest(REST_SEC, s.items[0] ? s.items[0].sets.length : 0);
  }

  function saveTemplate(t) {
    const s = state.sessions[selKey];
    if (!s || !s.items.length) { showToast('这天还没有动作'); return; }
    if (state.templates[t] && !confirm('覆盖「' + TYPES[t].label + '日」模板？')) return;
    state.templates[t] = {
      items: s.items.map((it) => ({
        name: it.name,
        part: it.part,
        note: '',
        sets: it.sets.map((x) => [x[0], x[1], x[2] === undefined ? null : x[2]]),
      })),
      updatedAt: Date.now(),
    };
    persist();
    renderTpl();
    showToast('已存为 ' + TYPES[t].label + '日模板');
  }

  function updateDaySum() {
    const s = state.sessions[selKey];
    if (!s) return;
    let vol = 0, setsN = 0;
    s.items.forEach((it) => it.sets.forEach((x) => { setsN += 1; vol += x[0] * x[1]; }));
    const el = $('#tDay .daysum');
    if (el) {
      el.textContent = s.items.length
        ? s.items.length + ' 个动作 · ' + setsN + ' 组 · 容量 ' + fmtVol(vol)
        : '今天还没记录';
    }
  }

  function renderAll() {
    renderHead();
    renderCal();
    renderDay();
    renderWeek();
    renderRecovery();
  }

  /* ---- 事件 ---- */
  $('#tDays').addEventListener('click', (e) => {
    const b = e.target.closest('.tday');
    if (!b || b.disabled) return;
    selKey = b.dataset.key;
    expanded = -1;
    renderCal();
    renderDay();
  });

  $('#tBody').addEventListener('click', (e) => {
    const mp = e.target.closest('[data-part]');
    if (mp) selectPart(mp.dataset.part);
  });

  $('#tDay').addEventListener('click', (e) => {
    const mp = e.target.closest('[data-part]');
    if (mp) { selectPart(mp.dataset.part); return; }

    const btn = e.target.closest('button');
    if (!btn) return;

    const act = btn.dataset.act;
    if (act) {
      const i = Number(btn.dataset.i);
      if (act === 'toggle') { expanded = expanded === i ? -1 : i; renderDay(); return; }
      if (act === 'addSet') {
        const it = ensure().items[i];
        if (it) { it.sets.push(it.sets[it.sets.length - 1].slice()); persist(); renderDay(); startRest(REST_SEC, it.sets.length); }
        return;
      }
      if (act === 'delSet') {
        const it = ensure().items[i];
        const si = Number(btn.dataset.s);
        if (it && it.sets.length > 1) { it.sets.splice(si, 1); persist(); renderDay(); }
        return;
      }
      if (act === 'delLastSet') {
        const it = ensure().items[i];
        if (it && it.sets.length > 1) { it.sets.pop(); persist(); renderDay(); }
        return;
      }
      if (act === 'delItem') {
        const s = ensure();
        if (s.items[i] && confirm('删除「' + s.items[i].name + '」？')) {
          s.items.splice(i, 1);
          expanded = -1;
          persist();
          renderAll();
        }
        return;
      }
      if (act === 'chart') { openChart(Number(btn.dataset.i)); return; }
    }

    if (btn.classList.contains('pchip')) {
      addPart = btn.dataset.p;
      refreshAdd();
      return;
    }

    if (btn.classList.contains('qchip')) {
      const nameEl = $('#exName');
      if (nameEl) {
        nameEl.value = btn.dataset.name;
        updateAddHints();
        const wEl = $('#exW');
        if (wEl) wEl.focus();
      }
      return;
    }

    if (btn.classList.contains('tbtn')) {
      const s = ensure();
      s.type = btn.dataset.type;
      const prev = lastSameType(s.type, selKey);
      s.ab = prev ? (prev[1].ab === 'A' ? 'B' : 'A') : 'A';
      persist();
      renderAll();
      return;
    }

    if (btn.dataset.ab) {
      const s = ensure();
      s.ab = btn.dataset.ab;
      persist();
      renderDay();
      return;
    }

    if (btn.id === 'tplOpen') { openTpl(); return; }
    if (btn.id === 'copyLast') { copyLast(); return; }
    if (btn.id === 'clearDay') {
      if (!confirm('清空这天的训练记录？')) return;
      delete state.sessions[selKey];
      expanded = -1;
      persist();
      renderAll();
      return;
    }
    if (btn.id === 'exAdd') { addExercise(); return; }
  });

  $('#tDay').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'exName') { updateAddHints(); return; }
    const f = t.dataset ? t.dataset.f : '';
    if (!f) return;
    const s = state.sessions[selKey];
    if (!s) return;
    const i = Number(t.dataset.i);
    const it = s.items[i];
    if (!it) return;
    if (f === 'note') { it.note = t.value.slice(0, 80); persist(); return; }
    const si = Number(t.dataset.s);
    if (!it.sets[si]) return;
    if (f === 'rir') {
      const raw = t.value.trim();
      if (raw === '') { it.sets[si][2] = null; persist(); return; }
      const n = Number(raw);
      if (!isFinite(n)) return;
      it.sets[si][2] = Math.max(0, Math.min(10, Math.floor(n)));
      persist();
      return;
    }
    let v = Number(t.value);
    if (!isFinite(v)) return;
    v = f === 'w' ? Math.max(0, v) : Math.max(1, Math.floor(v));
    it.sets[si][f === 'w' ? 0 : 1] = v;
    const row = t.closest ? t.closest('.item') : null;
    if (row) {
      const sum = row.querySelector('.isets');
      if (sum) sum.textContent = summaryOf(it.sets);
    }
    updateDaySum();
    persist();
  });

  $('#tDay').addEventListener('change', (e) => {
    const t = e.target;
    if (!t.dataset || (t.dataset.f !== 'w' && t.dataset.f !== 'r')) return;
    const s = state.sessions[selKey];
    if (!s) return;
    const it = s.items[Number(t.dataset.i)];
    if (!it) return;
    const pr = itemPR(it);
    if (pr) {
      showToast('🎉 ' + it.name + ' 新纪录 ' + fmtW(pr.set[0]) + '×' + pr.set[1]);
      renderDay();
    }
  });

  $('#tDay').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.target.id === 'exName' || e.target.id === 'exW' ||
        e.target.id === 'exR' || e.target.id === 'exS')) {
      e.preventDefault();
      addExercise();
    }
    if (e.key === 'Escape') $('#tModal').hidden = true;
  });

  $('#tPrev').addEventListener('click', () => {
    view.m -= 1;
    if (view.m < 1) { view.m = 12; view.y -= 1; }
    syncSelection();
    renderAll();
  });
  $('#tNext').addEventListener('click', () => {
    view.m += 1;
    if (view.m > 12) { view.m = 1; view.y += 1; }
    syncSelection();
    renderAll();
  });

  function syncSelection() {
    if (selKey.indexOf(view.y + '-' + pad(view.m)) !== 0) {
      selKey = (view.y === today.getFullYear() && view.m === today.getMonth() + 1)
        ? todayKey : keyOf(view.y, view.m, 1);
      expanded = -1;
    }
  }

  $('#tClose').addEventListener('click', () => { $('#tModal').hidden = true; });
  $('#tModal').addEventListener('click', (e) => {
    if (e.target.id === 'tModal') $('#tModal').hidden = true;
  });
  $('#restSkip').addEventListener('click', stopRest);
  $('#restNext').addEventListener('click', nextRest);
  $('#restMinus').addEventListener('click', () => {
    restEnd = Math.max(Date.now(), restEnd - 15000);
    tickRest();
  });
  $('#restPlus').addEventListener('click', () => { restEnd += 15000; tickRest(); });
  $('#tplClose').addEventListener('click', closeTpl);
  $('#tplModal').addEventListener('click', (e) => {
    if (e.target.id === 'tplModal') closeTpl();
  });
  $('#tplList').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tplApply) applyTemplate(b.dataset.tplApply);
    else if (b.dataset.tplSave) saveTemplate(b.dataset.tplSave);
    else if (b.dataset.tplDel) {
      if (confirm('清除这个模板？')) {
        delete state.templates[b.dataset.tplDel];
        persist();
        renderTpl();
      }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      $('#tModal').hidden = true;
      $('#impModal').hidden = true;
      $('#tplModal').hidden = true;
    }
  });

  $('#tExport').addEventListener('click', () => {
    let habits = null;
    try {
      const raw = JSON.parse(localStorage.getItem(HKEY) || 'null');
      if (raw && Array.isArray(raw.habits)) habits = raw.habits;
    } catch (err) { habits = null; }
    const data = {
      app: 'habit-calendar',
      exportedAt: new Date().toISOString(),
      habits: habits,
      training: state,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'habit-training-' + todayKey + '.json';
    a.click();
    try { localStorage.setItem(EXPORT_KEY, String(Date.now())); } catch (err) { /* 忽略 */ }
    renderBackupTip();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  /* ---- 导入与合并 ---- */
  const PART_HINTS = [
    ['Pallof', '核心'], ['卷腹', '核心'], ['举腿', '核心'], ['侧平板', '核心'], ['平板支撑', '核心'],
    ['健腹', '核心'], ['转体', '核心'], ['登山', '核心'], ['死虫', '核心'],
    ['鸟狗', '核心'], ['自行车', '核心'],
    ['腿弯举', '腿'], ['腿屈伸', '腿'], ['罗马尼亚硬拉', '腿'], ['前蹲', '腿'], ['深蹲', '腿'],
    ['静蹲', '腿'], ['腿举', '腿'], ['提踵', '腿'], ['髋内收', '腿'], ['髋外展', '腿'],
    ['分腿', '腿'], ['弓步', '腿'], ['箭步', '腿'], ['侧步', '腿'], ['台阶', '腿'], ['臀', '腿'],
    ['直立划船', '肩'], ['反向飞鸟', '肩'], ['推肩', '肩'], ['肩推', '肩'], ['推举', '肩'],
    ['侧平举', '肩'], ['前平举', '肩'], ['后束', '肩'],
    ['过顶', '臂'], ['双杠', '胸'], ['弯举', '臂'], ['下压', '臂'], ['窄距卧推', '臂'], ['臂屈伸', '臂'],
    ['仰卧上拉', '胸'], ['卧推', '胸'], ['推胸', '胸'], ['飞鸟', '胸'], ['夹胸', '胸'], ['俯卧撑', '胸'],
    ['引体', '背'], ['下拉', '背'], ['划船', '背'], ['硬拉', '背'], ['面拉', '背'], ['直臂', '背'],
    ['山羊', '背'], ['耸肩', '背'], ['超人', '背'],
  ];

  function guessPart(name, type) {
    for (const h of PART_HINTS) {
      if (name.indexOf(h[0]) !== -1) return h[1];
    }
    return type === 'push' ? '胸' : type === 'pull' ? '背' : '腿';
  }

  function isChatGptExport(d) {
    return Boolean(d && !d.training && Array.isArray(d.sessions) && d.sessions.length &&
      d.sessions[0] && d.sessions[0].date && Array.isArray(d.sessions[0].exercises));
  }

  function convertChatGpt(d) {
    const sessions = {};
    const exercises = {};
    for (const s of d.sessions) {
      if (!s || !s.date || !s.split) continue;
      const m = /^(Push|Pull|Legs)\s*([AB])?/i.exec(String(s.split));
      if (!m) continue;
      const type = m[1].toLowerCase();
      const ab = (m[2] || 'A').toUpperCase();
      const items = [];
      for (const e of s.exercises || []) {
        const name = String(e.exercise || '').trim().slice(0, 20);
        if (!name) continue;
        const wl = e.working_load || {};
        const unit = wl.unit || 'kg';
        const notes = [];
        let w = 0;
        if (typeof wl.value === 'number') {
          if (wl.type === 'assistance') notes.push('辅助 ' + wl.value + 'kg');
          else w = unit === 'lb' ? Math.round(wl.value * 0.4536 * 2) / 2 : wl.value;
        }
        if (e.notes) notes.push(String(e.notes));
        const sets = [];
        (e.sets || []).forEach((st, idx) => {
          const reps = Number(st && st.reps);
          if (!reps || reps < 1) return;
          let load = w;
          if (Array.isArray(e.per_set_load) && typeof e.per_set_load[idx] === 'number') {
            load = unit === 'lb' ? Math.round(e.per_set_load[idx] * 0.4536 * 2) / 2 : e.per_set_load[idx];
          }
          const rawRir = st ? st.rir : null;
          const numRir = typeof rawRir === 'number' ? rawRir
            : (typeof rawRir === 'string' && /^\d+(\.\d+)?$/.test(rawRir) ? Number(rawRir) : NaN);
          const rir = isFinite(numRir) ? Math.max(0, Math.min(10, Math.floor(numRir))) : null;
          sets.push([Math.max(0, load), Math.max(1, Math.floor(reps)), rir]);
        });
        if (!sets.length) continue;
        const part = guessPart(name, type);
        items.push({ name: name, part: part, note: notes.join('；').slice(0, 80), sets: sets });
        exercises[name] = part;
      }
      if (!items.length) continue;
      if (sessions[s.date]) sessions[s.date].items = sessions[s.date].items.concat(items);
      else sessions[s.date] = { type: type, ab: ab, items: items, updatedAt: 0 };
    }
    return { sessions: sessions, exercises: exercises };
  }

  let pending = null;

  function readHabits() {
    try {
      const raw = JSON.parse(localStorage.getItem(HKEY) || 'null');
      return raw && Array.isArray(raw.habits) ? raw.habits : [];
    } catch (err) {
      return [];
    }
  }

  function backupNeeded() {
    try {
      const hasData = Object.keys(state.sessions).length > 0 || readHabits().length > 0;
      if (!hasData) return false;
      const now = Date.now();
      const snooze = Number(localStorage.getItem(SNOOZE_KEY) || 0);
      if (snooze && now - snooze < WEEK_MS) return false;
      const last = Number(localStorage.getItem(EXPORT_KEY) || 0);
      return !last || now - last > WEEK_MS;
    } catch (err) {
      return false;
    }
  }

  function renderBackupTip() {
    const el = $('#backupTip');
    if (!el) return;
    el.hidden = !backupNeeded();
  }

  function mergeHabits(a, b) {
    const map = new Map();
    const put = (h) => {
      if (!h || typeof h.name !== 'string') return;
      const id = typeof h.id === 'string' && h.id ? h.id : 'x' + Math.random().toString(36).slice(2);
      const cur = map.get(id);
      if (!cur) { map.set(id, Object.assign({}, h, { id: id })); return; }
      const newer = (Number(h.updatedAt) || 0) >= (Number(cur.updatedAt) || 0) ? h : cur;
      map.set(id, Object.assign({}, newer, {
        id: id,
        days: Object.assign({}, cur.days || {}, h.days || {}),
      }));
    };
    (a || []).forEach(put);
    (b || []).forEach(put);
    return Array.from(map.values());
  }

  function mergeTraining(local, incoming) {
    const out = { sessions: {}, exercises: {} };
    const ls = (local && local.sessions) || {};
    const is = (incoming && incoming.sessions) || {};
    for (const k of Object.keys(ls)) out.sessions[k] = ls[k];
    for (const k of Object.keys(is)) {
      const a = out.sessions[k];
      const b = is[k];
      if (!a) { out.sessions[k] = b; continue; }
      out.sessions[k] = (Number(b.updatedAt) || 0) >= (Number(a.updatedAt) || 0) ? b : a;
    }
    out.exercises = Object.assign({}, (incoming && incoming.exercises) || {}, (local && local.exercises) || {});
    out.templates = {};
    const lt = (local && local.templates) || {};
    const it = (incoming && incoming.templates) || {};
    for (const t of ORDER) {
      const a = lt[t];
      const b = it[t];
      out.templates[t] = !a ? b : (!b ? a : ((Number(b.updatedAt) || 0) >= (Number(a.updatedAt) || 0) ? b : a));
    }
    return normalize(out);
  }

  function applyImport(d, merge) {
    if (d.habits) {
      const list = merge ? mergeHabits(readHabits(), d.habits) : d.habits;
      localStorage.setItem(HKEY, JSON.stringify({ habits: list }));
    }
    if (d.training) {
      const inc = normalize(d.training);
      const out = merge ? mergeTraining(state, inc) : inc;
      localStorage.setItem(TKEY, JSON.stringify(out));
    }
    location.reload();
  }

  $('#tImport').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      let d = JSON.parse(await file.text());
      let converted = false;
      if (isChatGptExport(d)) {
        d = { habits: null, training: convertChatGpt(d) };
        converted = true;
      }
      if (!d || (!d.training && !d.habits)) throw new Error('不是这个应用导出的文件');
      pending = d;
      const ns = d.training && d.training.sessions ? Object.keys(d.training.sessions).length : 0;
      const nh = Array.isArray(d.habits) ? d.habits.length : 0;
      $('#impInfo').textContent = (converted
        ? '识别到 ChatGPT 导出，已转换为 ' + ns + ' 天训练。'
        : '文件里有 ' + ns + ' 天训练、' + nh + ' 个习惯。') +
        '合并会保留两边记录，同一天以更新时间较新的为准。';
      $('#impModal').hidden = false;
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  });

  $('#impMerge').addEventListener('click', () => {
    if (!pending) return;
    const d = pending;
    pending = null;
    applyImport(d, true);
  });
  $('#impReplace').addEventListener('click', () => {
    if (!pending) return;
    const d = pending;
    pending = null;
    applyImport(d, false);
  });
  $('#impCancel').addEventListener('click', () => {
    pending = null;
    $('#impModal').hidden = true;
  });
  $('#impModal').addEventListener('click', (e) => {
    if (e.target.id === 'impModal') {
      pending = null;
      $('#impModal').hidden = true;
    }
  });

  $('#backupNow').addEventListener('click', () => { $('#tExport').click(); });
  $('#backupLater').addEventListener('click', () => {
    try { localStorage.setItem(SNOOZE_KEY, String(Date.now())); } catch (err) { /* 忽略 */ }
    renderBackupTip();
  });

  if ('serviceWorker' in navigator) {
    const host = location.hostname;
    const secure = location.protocol === 'https:' || host === 'localhost' || host === '127.0.0.1';
    if (secure) {
      try { navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (err) { /* 忽略 */ }
    }
  }
  renderBackupTip();
  renderAll();
})();
</script>
</body>
</html>
